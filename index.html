  <div class="label">初回設定</div>      
  <textarea id="novelId" placeholder="Novel ID"></textarea>      
  <textarea id="reviewId" placeholder="Review ID"></textarea>      
  <button class="primary" onclick="saveConfig()">START</button>      
</div>  <!-- SELECT -->  <div id="select" class="card hidden">      
  <div class="label">Novel Select</div>

</select>    </div>    <div class="card">

let db;

let currentSheetName = "";

let answers = {};
let memos = {};

/* ===== CHECK ===== */
function check(){
save().then(()=>{
const el = document.getElementById("correctJP");
el.innerText =
(data[i] && data[i].correctJP) ? data[i].correctJP : "";
});
}

/* ===== NAV ===== */
function next(){

answers[i] =
document.getElementById("answer").value;

memos[i] =
document.getElementById("memo").value;

if(i < data.length - 1){
i++;
render();
}

}

function prev(){

answers[i] =
document.getElementById("answer").value;

memos[i] =
document.getElementById("memo").value;

if(i > 0){
i--;
render();
}

}
