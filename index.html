<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.wrap{max-width:900px;margin:auto;padding:16px;}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;}
textarea,select,button{width:100%;box-sizing:border-box;margin-top:10px;padding:10px;}
button{border:none;border-radius:8px;background:#4CAF50;color:#fff;}
.hidden{display:none;}
.current{font-size:22px;font-weight:bold;}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div class="card">
  <div id="loginBtn"></div>
</div>

<!-- SETUP -->
<div id="setup" class="card hidden">
  <textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
  <textarea id="reviewId" placeholder="ReviewDB ID"></textarea>
  <button onclick="saveConfig()">START</button>
</div>

<!-- SELECT -->
<div id="select" class="card hidden">
  <select id="novelList"></select>
  <button onclick="openNovel()">OPEN</button>
</div>

<!-- APP -->
<div id="app" class="card hidden">
  <div id="current" class="current"></div>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {};
let data = [];
let index = 0;

/* =========================
   Google Login 安定初期化
========================= */
function initGoogle(){

  if(!window.google || !google.accounts){
    setTimeout(initGoogle, 50);
    return;
  }

  google.accounts.id.initialize({
    client_id: "9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com",
    callback: handleLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("loginBtn"),
    { theme: "outline", size: "large" }
  );
}

window.addEventListener("load", initGoogle);

/* =========================
   LOGIN
========================= */
function handleLogin(res){

  const payload =
    JSON.parse(atob(res.credential.split('.')[1]));

  userId = payload.sub || payload.email;

  document.getElementById("setup")
    .classList.remove("hidden");
}

/* =========================
   CONFIG → LIST
========================= */
async function saveConfig(){

  config.novelId =
    document.getElementById("novelId").value.trim();

  config.reviewId =
    document.getElementById("reviewId").value.trim();

  const list = await jsonp(
    `${API_URL}?mode=getNovelList&spreadsheetId=${config.novelId}`
  );

  const sel = document.getElementById("novelList");
  sel.innerHTML = "";

  list.forEach(n=>{
    const opt = document.createElement("option");
    opt.value = n.name;
    opt.textContent = n.name;
    sel.appendChild(opt);
  });

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("select").classList.remove("hidden");
}

/* =========================
   OPEN NOVEL
========================= */
async function openNovel(){

  const sheetName =
    document.getElementById("novelList").value;

  data = await jsonp(
    `${API_URL}?mode=loadNovel`
    + `&spreadsheetId=${config.novelId}`
    + `&sheetName=${sheetName}`
  );

  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  index = 0;
  render();
}

/* =========================
   RENDER
========================= */
function render(){

  document.getElementById("current").innerText =
    data[index]?.english || "END";
}

/* =========================
   JSONP
========================= */
function jsonp(url){

  return new Promise(resolve => {

    const cb = "cb_" + Math.random().toString(36).slice(2);

    window[cb] = (res) => {
      delete window[cb];
      document.body.removeChild(script);
      resolve(res);
    };

    const script = document.createElement("script");
    script.src = url + "&callback=" + cb;
    document.body.appendChild(script);
  });
}

</script>

</body>
</html>
