<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {};
let data = [];
let i = 0;

/* =========================
   SAFE ELEMENT
========================= */
function el(id){
  return document.getElementById(id);
}

/* =========================
   LOGIN INIT
========================= */
function init(){

  if(!window.google || !google.accounts){
    setTimeout(init,100);
    return;
  }

  const btn = el("loginBtn");

  if(!btn){
    console.error("loginBtn missing");
    return;
  }

  google.accounts.id.initialize({
    client_id:"9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com",
    callback:handleLogin
  });

  google.accounts.id.renderButton(btn,{
    theme:"outline",
    size:"large"
  });
}

window.addEventListener("load",init);

/* =========================
   LOGIN
========================= */
async function handleLogin(res){

  try{

    const p = JSON.parse(
      atob(res.credential.split('.')[1])
    );

    userId = p.sub || p.email;

    const saved =
      localStorage.getItem("learning_config");

    if(!saved){
      showSetup();
      return;
    }

    config = JSON.parse(saved);

    const list = await jsonp(
      `${API_URL}?mode=getNovelList&spreadsheetId=${config.novelId}`
    );

    if(!Array.isArray(list)){
      throw new Error("invalid list");
    }

    await loadNovelList(list);

  }catch(err){

    console.error(err);

    localStorage.removeItem("learning_config");

    showSetup();
  }
}

/* =========================
   SHOW SETUP
========================= */
function showSetup(){

  const setup = el("setup");
  const select = el("select");
  const app = el("app");

  if(setup){
    setup.classList.remove("hidden");
  }

  if(select){
    select.classList.add("hidden");
  }

  if(app){
    app.classList.add("hidden");
  }
}

/* =========================
   SAVE CONFIG
========================= */
async function saveConfig(){

  try{

    config.novelId =
      el("novelId")?.value.trim();

    config.reviewId =
      el("reviewId")?.value.trim();

    if(!config.novelId || !config.reviewId){
      alert("Spreadsheet ID required");
      return;
    }

    localStorage.setItem(
      "learning_config",
      JSON.stringify(config)
    );

    await loadNovelList();

  }catch(err){

    console.error(err);

    alert("saveConfig error");
  }
}

/* =========================
   LOAD NOVEL LIST
========================= */
async function loadNovelList(preloaded=null){

  try{

    const list = preloaded || await jsonp(
      `${API_URL}?mode=getNovelList&spreadsheetId=${config.novelId}`
    );

    const sel = el("novelList");

    if(!sel){
      alert("novelList missing");
      return;
    }

    sel.innerHTML = "";

    list.forEach(n=>{

      const o = document.createElement("option");

      o.value = n.name;
      o.textContent = n.name;

      sel.appendChild(o);
    });

    el("setup")?.classList.add("hidden");

    el("select")?.classList.remove("hidden");

  }catch(err){

    console.error(err);

    alert("Spreadsheet ID error");

    localStorage.removeItem("learning_config");

    showSetup();
  }
}

/* =========================
   CHANGE CONFIG
========================= */
function changeConfig(){

  localStorage.removeItem("learning_config");

  config = {};

  showSetup();
}

/* =========================
   OPEN NOVEL
========================= */
async function openNovel(){

  try{

    const sheet =
      el("novelList")?.value;

    data = await jsonp(
      `${API_URL}?mode=loadNovel`
      +`&spreadsheetId=${config.novelId}`
      +`&sheetName=${sheet}`
    );

    i = 0;

    el("select")?.classList.add("hidden");

    el("app")?.classList.remove("hidden");

    render();

  }catch(err){

    console.error(err);

    alert("openNovel error");
  }
}

/* =========================
   SAVE
========================= */
async function save(){

  try{

    const payload = {
      userId,
      novelId: config.novelId,
      sentenceId: i,
      chapter: data[i]?.chapter,
      english: data[i]?.english,
      answer: el("answer")?.value || "",
      memo: el("memo")?.value || "",
      time: new Date().toISOString(),
      currentIndex: i,
      novelSpreadsheetId: config.novelId,
      reviewSpreadsheetId: config.reviewId
    };

    await jsonp(
      `${API_URL}?mode=save`
      +`&reviewSpreadsheetId=${config.reviewId}`
      +`&data=${encodeURIComponent(JSON.stringify(payload))}`
    );

  }catch(err){

    console.error(err);

    alert("save error");
  }
}

/* =========================
   NAV
========================= */
function next(){

  if(i < data.length - 1){
    i++;
    render();
  }
}

function prev(){

  if(i > 0){
    i--;
    render();
  }
}

/* =========================
   RENDER
========================= */
function render(){

  try{

    const prevEl = el("prev");
    const currEl = el("current");
    const nextEl = el("next");

    if(!currEl){
      console.error("current missing");
      return;
    }

    const prevText =
      data[i-1]?.english || "";

    const currText =
      data[i]?.english || "";

    const nextText =
      data[i+1]?.english || "";

    if(prevEl){
      prevEl.innerText = prevText;
    }

    currEl.innerText = currText || "END";

    if(nextEl){
      nextEl.innerText = nextText;
    }

  }catch(err){

    console.error(err);

    alert("render error");
  }
}

/* =========================
   JSONP
========================= */
function jsonp(url){

  return new Promise((resolve,reject)=>{

    const cb =
      "cb_" + Math.random().toString(36).slice(2);

    let finished = false;

    const timeout = setTimeout(()=>{

      if(finished){
        return;
      }

      finished = true;

      delete window[cb];

      if(document.body.contains(s)){
        document.body.removeChild(s);
      }

      reject(new Error("timeout"));

    },10000);

    window[cb] = r=>{

      if(finished){
        return;
      }

      finished = true;

      clearTimeout(timeout);

      delete window[cb];

      if(document.body.contains(s)){
        document.body.removeChild(s);
      }

      resolve(r);
    };

    const s = document.createElement("script");

    s.onerror = ()=>{

      if(finished){
        return;
      }

      finished = true;

      clearTimeout(timeout);

      delete window[cb];

      reject(new Error("network"));
    };

    s.src = url + "&callback=" + cb;

    document.body.appendChild(s);
  });
}

</script>
