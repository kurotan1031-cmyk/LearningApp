<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;margin:0}
.wrap{max-width:900px;margin:auto;padding:20px}
.current{font-size:22px;margin:10px 0}
.prev,.next{color:#777;white-space:pre-wrap;font-size:14px}
textarea{width:100%;height:70px;margin-top:10px}
button{margin:5px}
</style>

</head>

<body>

<div class="wrap">

<!-- Googleログインボタン -->
<div id="g_id_onload"
     data-client_id="9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"></div>

<!-- 初回設定 -->
<div id="setup" style="display:none">
<h3>初回設定</h3>
<textarea id="novelId" placeholder="Novel Spreadsheet ID"></textarea>
<textarea id="reviewId" placeholder="ReviewDB Spreadsheet ID"></textarea>
<button onclick="saveSetup()">保存</button>
</div>

<!-- アプリ本体 -->
<div id="app" style="display:none">

<div id="prev"></div>
<div id="current" class="current"></div>
<div id="next"></div>

<textarea id="answer"></textarea>
<textarea id="memo"></textarea>

<button onclick="save()">SAVE</button>
<button onclick="next()">NEXT</button>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {};
let data = [];
let i = 0;

/* Googleログイン成功 */
function handleCredentialResponse(res){

  try{
    const payload = JSON.parse(atob(res.credential.split('.')[1]));
    userId = payload.email;

    console.log("LOGIN OK:", userId);

    restore();

  }catch(e){
    console.error("login error", e);
  }
}

/* 初期化（重要：これが今回の本体） */
window.onload = () => {

  google.accounts.id.initialize({
    client_id: "YOUR_CLIENT_ID",
    callback: handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.querySelector(".g_id_signin"),
    { theme: "outline", size: "large" }
  );
};

/* restore */
async function restore(){

  try{
    const r = await fetch(`${API_URL}?mode=restore&userId=${userId}&reviewSpreadsheetId=${config.reviewSpreadsheetId||""}`);
    const j = await r.json();

    if(j.first){
      document.getElementById("setup").style.display = "block";
      return;
    }

    loadNovel(j.novelId, j.currentIndex || 0);

  }catch(e){
    console.error(e);
  }
}

/* 初回設定保存 */
function saveSetup(){

  config.novelSpreadsheetId = document.getElementById("novelId").value.trim();
  config.reviewSpreadsheetId = document.getElementById("reviewId").value.trim();

  document.getElementById("setup").style.display = "none";
}

/* ノベルロード */
async function loadNovel(sheet,start){

  try{
    const r = await fetch(`${API_URL}?mode=loadNovel&sheet=${sheet}&spreadsheetId=${config.novelSpreadsheetId}`);
    data = await r.json();

    i = start;

    document.getElementById("app").style.display = "block";
    render();

  }catch(e){
    console.error(e);
  }
}

/* 表示 */
function render(){

  if(!data[i]) return;

  document.getElementById("current").innerText = data[i].english;

  document.getElementById("prev").innerText =
    (data[i-1]?.english || "") + "\n" + (data[i-2]?.english || "");

  document.getElementById("next").innerText =
    (data[i+1]?.english || "") + "\n" + (data[i+2]?.english || "");
}

/* 保存 */
async function save(){

  const d = data[i];

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      userId,
      novelId:d.chapter,
      sentenceId:i,
      chapter:d.chapter,
      english:d.english,
      answer:document.getElementById("answer").value,
      memo:document.getElementById("memo").value,
      time:new Date().toISOString(),
      currentIndex:i,
      novelSpreadsheetId:config.novelSpreadsheetId,
      reviewSpreadsheetId:config.reviewSpreadsheetId
    })
  });

}

/* next */
function next(){
  if(i < data.length - 1){
    i++;
    render();
  }
}

</script>

</body>
</html>
