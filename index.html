<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId="";
let config={};
let data=[];
let i=0;

/* =========================
   LOGIN INIT
========================= */
function init(){

  if(!window.google || !google.accounts){
    setTimeout(init,50);
    return;
  }

  google.accounts.id.initialize({
    client_id:"9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com",
    callback:handleLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("loginBtn"),
    {theme:"outline",size:"large"}
  );
}

window.addEventListener("load",init);

/* =========================
   LOGIN
========================= */
async function handleLogin(res){

  const p = JSON.parse(atob(res.credential.split('.')[1]));
  userId = p.sub || p.email;

  try{

    const restoreData = await jsonp(
      `${API_URL}?mode=restore`
      +`&userId=${encodeURIComponent(userId)}`
    );

    /* 初回ユーザー */
    if(restoreData.status === "new_user"){

      document.getElementById("setup")
        .classList.remove("hidden");

      return;
    }

    /* 復元 */
    config.novelId =
      restoreData.novelSpreadsheetId;

    config.reviewId =
      restoreData.reviewSpreadsheetId;

    await loadNovelList();

  }catch(err){

    console.error(err);

    document.getElementById("setup")
      .classList.remove("hidden");
  }
}

/* =========================
   CONFIG → LIST
========================= */
async function saveConfig(){

  config.novelId =
    document.getElementById("novelId")
    .value.trim();

  config.reviewId =
    document.getElementById("reviewId")
    .value.trim();

  await loadNovelList();
}

/* =========================
   LOAD NOVEL LIST
========================= */
async function loadNovelList(){

  const list = await jsonp(
    `${API_URL}?mode=getNovelList`
    +`&spreadsheetId=${config.novelId}`
  );

  const sel =
    document.getElementById("novelList");

  sel.innerHTML = "";

  list.forEach(n=>{

    const o = document.createElement("option");

    o.value = n.name;
    o.textContent = n.name;

    sel.appendChild(o);
  });

  document.getElementById("setup")
    .classList.add("hidden");

  document.getElementById("select")
    .classList.remove("hidden");
}

/* =========================
   SHOW SETUP
========================= */
function showSetup(){

  document.getElementById("setup")
    .classList.remove("hidden");

  document.getElementById("select")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.add("hidden");
}

/* =========================
   OPEN NOVEL
========================= */
async function openNovel(){

  const sheet =
    document.getElementById("novelList").value;

  data = await jsonp(
    `${API_URL}?mode=loadNovel`
    +`&spreadsheetId=${config.novelId}`
    +`&sheetName=${sheet}`
  );

  i = 0;

  document.getElementById("select")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  render();
}

/* =========================
   SAVE
========================= */
async function save(){

  const payload = {
    userId,
    novelId: config.novelId,
    sentenceId: i,
    chapter: data[i]?.chapter,
    english: data[i]?.english,
    answer:
      document.getElementById("answer").value,
    memo:
      document.getElementById("memo").value,
    time: new Date().toISOString(),
    currentIndex: i,
    novelSpreadsheetId: config.novelId,
    reviewSpreadsheetId: config.reviewId
  };

  await jsonp(
    `${API_URL}?mode=save`
    +`&reviewSpreadsheetId=${config.reviewId}`
    +`&data=${encodeURIComponent(JSON.stringify(payload))}`
  );
}

/* =========================
   NAV
========================= */
function next(){

  if(i < data.length - 1){
    i++;
    render();
  }
}

function prev(){

  if(i > 0){
    i--;
    render();
  }
}

/* =========================
   RENDER
========================= */
function render(){

  const prevText =
    data[i-1]?.english || "";

  const currText =
    data[i]?.english || "";

  const nextText =
    data[i+1]?.english || "";

  document.getElementById("prev")
    .innerText = prevText;

  document.getElementById("current")
    .innerText = currText || "END";

  document.getElementById("next")
    .innerText = nextText;
}

/* =========================
   JSONP
========================= */
function jsonp(url){

  return new Promise(res=>{

    const cb =
      "cb_" + Math.random().toString(36).slice(2);

    window[cb] = r=>{

      delete window[cb];

      document.body.removeChild(s);

      res(r);
    };

    const s =
      document.createElement("script");

    s.src = url + "&callback=" + cb;

    document.body.appendChild(s);
  });
}

</script>
