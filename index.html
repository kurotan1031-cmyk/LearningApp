<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.wrap{max-width:900px;margin:auto;padding:16px;}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;}
textarea,select,button{width:100%;box-sizing:border-box;margin-top:10px;padding:10px;}
button{border:none;border-radius:8px;background:#4CAF50;color:#fff;}
.hidden{display:none;}
.current{font-size:22px;font-weight:bold;}
</style>

</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div class="card">
  <div id="g_id_onload"
       data-client_id="9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com"
       data-callback="handleLogin">
  </div>
  <div class="g_id_signin"></div>
</div>

<!-- SETUP -->
<div id="setup" class="card hidden">
  <textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
  <textarea id="reviewId" placeholder="ReviewDB ID"></textarea>
  <button onclick="saveConfig()">START</button>
</div>

<!-- NOVEL SELECT -->
<div id="select" class="card hidden">
  <select id="novelList"></select>
  <button onclick="openNovel()">OPEN</button>
</div>

<!-- APP -->
<div id="app" class="card hidden">
  <div id="current" class="current"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {};
let data = [];
let currentIndex = 0;

/* LOGIN */
function handleLogin(res){

  const payload = JSON.parse(atob(res.credential.split('.')[1]));
  userId = payload.sub || payload.email;

  restore();
}

/* RESTORE */
async function restore(){

  const r = await fetch(
    `${API_URL}?mode=restoreConfig&userId=${userId}&reviewSpreadsheetId=`
  );

  const j = await r.json();

  if(j.status !== "ok"){
    document.getElementById("setup").classList.remove("hidden");
    return;
  }

  config = j;

  loadNovelList();
}

/* SAVE CONFIG */
async function saveConfig(){

  config.novelSpreadsheetId =
    document.getElementById("novelId").value.trim();

  config.reviewSpreadsheetId =
    document.getElementById("reviewId").value.trim();

  loadNovelList();
}

/* NOVEL LIST */
async function loadNovelList(){

  const r = await fetch(
    `${API_URL}?mode=getNovelList&spreadsheetId=${config.novelSpreadsheetId}`
  );

  const list = await r.json();

  const sel = document.getElementById("novelList");
  sel.innerHTML = "";

  list.forEach(n=>{
    const opt = document.createElement("option");
    opt.value = n.name;
    opt.textContent = n.name;
    sel.appendChild(opt);
  });

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("select").classList.remove("hidden");
}

/* OPEN NOVEL */
async function openNovel(){

  const sheetName = document.getElementById("novelList").value;

  const r = await fetch(
    `${API_URL}?mode=loadNovel&spreadsheetId=${config.novelSpreadsheetId}&sheetName=${sheetName}`
  );

  data = await r.json();

  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  currentIndex = 0;
  render();
}

/* RENDER */
function render(){
  document.getElementById("current").innerText =
    data[currentIndex]?.english || "END";
}

</script>

</body>
</html>
