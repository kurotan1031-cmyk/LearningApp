<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
  color:#333;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h1{
  font-size:20px;
  margin:0 0 10px 0;
}

.status{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.current{
  font-size:22px;
  font-weight:bold;
}

.prev,.nextText{
  color:#666;
  white-space:pre-wrap;
  font-size:14px;
}

textarea{
  width:100%;
  height:70px;
  margin-top:8px;
  padding:10px;
  font-size:14px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.primary{background:#4CAF50;color:white}
.nextBtn{background:#2196F3;color:white}

/* PC */
@media (min-width: 768px){
  .current{font-size:28px}
  textarea{height:90px}
  .prev,.nextText{font-size:16px}
}

/* SP */
@media (max-width: 767px){
  button{width:100%}
}
</style>

</head>

<body>

<div class="wrap">

<!-- Googleログイン（ここだけで完結） -->
<div class="card">

  <h1>英語学習アプリ</h1>
  <div class="status">Googleアカウントでログインしてください</div>

  <div id="g_id_onload"
       data-client_id="9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"></div>

</div>

<!-- 初期設定 -->
<div id="setup" class="card" style="display:none">

  <div class="status">初回のみ設定</div>

  <label>英語教材スプレッドシートID</label>
  <textarea id="novelId"></textarea>

  <label>復習データ保存スプレッドシートID</label>
  <textarea id="reviewId"></textarea>

  <button class="primary" onclick="saveSetup()">設定して開始</button>

</div>

<!-- 本体 -->
<div id="app" style="display:none">

  <div class="card">
    <div class="status">前（2文）</div>
    <div id="prev" class="prev"></div>
  </div>

  <div class="card">
    <div class="status">現在</div>
    <div id="current" class="current"></div>
  </div>

  <div class="card">
    <div class="status">次（2文）</div>
    <div id="next" class="nextText"></div>
  </div>

  <div class="card">
    <div class="status">入力</div>

    <textarea id="answer" placeholder="英語の意味"></textarea>
    <textarea id="memo" placeholder="メモ"></textarea>

    <button class="primary" onclick="save()">保存</button>
    <button class="nextBtn" onclick="next()">次へ</button>
  </div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {};
let data = [];
let i = 0;

/* Googleログイン成功 */
function handleCredentialResponse(res){

  try{
    const payload = JSON.parse(atob(res.credential.split('.')[1]));
    userId = payload.email;

    restore();

  }catch(e){
    console.error("login error", e);
  }
}

/* restore */
async function restore(){

  const r = await fetch(`${API_URL}?mode=restore&userId=${userId}&reviewSpreadsheetId=${config.reviewSpreadsheetId||""}`);
  const j = await r.json();

  if(j.first){
    document.getElementById("setup").style.display = "block";
    return;
  }

  loadNovel(j.novelId, j.currentIndex || 0);
}

/* setup */
function saveSetup(){

  config.novelSpreadsheetId = document.getElementById("novelId").value.trim();
  config.reviewSpreadsheetId = document.getElementById("reviewId").value.trim();

  document.getElementById("setup").style.display = "none";
}

/* load */
async function loadNovel(sheet,start){

  const r = await fetch(`${API_URL}?mode=loadNovel&sheet=${sheet}&spreadsheetId=${config.novelSpreadsheetId}`);
  data = await r.json();

  i = start;
  document.getElementById("app").style.display = "block";
  render();
}

/* render */
function render(){

  if(!data[i]) return;

  document.getElementById("current").innerText = data[i].english;

  document.getElementById("prev").innerText =
    (data[i-1]?.english || "") + "\n" + (data[i-2]?.english || "");

  document.getElementById("next").innerText =
    (data[i+1]?.english || "") + "\n" + (data[i+2]?.english || "");
}

/* save */
async function save(){

  const d = data[i];

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      userId,
      novelId:d.chapter,
      sentenceId:i,
      chapter:d.chapter,
      english:d.english,
      answer:document.getElementById("answer").value,
      memo:document.getElementById("memo").value,
      time:new Date().toISOString(),
      currentIndex:i,
      novelSpreadsheetId:config.novelSpreadsheetId,
      reviewSpreadsheetId:config.reviewSpreadsheetId
    })
  });

}

/* next */
function next(){
  if(i < data.length - 1){
    i++;
    render();
  }
}

</script>

</body>
</html>
