<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.hidden{display:none;}

textarea, select{
  width:100%;
  margin-top:8px;
  padding:10px;
  box-sizing:border-box;
}

.current{
  font-size:24px;
  font-weight:bold;
  line-height:1.5;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="wrap">

<div id="setup" class="card hidden">
  <textarea id="novelId" placeholder="Novel ID"></textarea>
  <textarea id="reviewId" placeholder="Review ID"></textarea>
  <button onclick="saveConfig()">START</button>
</div>

<div id="select" class="card hidden">
  <select id="novelList"></select>
  <button onclick="openNovel()">START</button>
</div>

<div id="app" class="hidden">
  <div class="card">
    <div id="current" class="current"></div>
  </div>
  <button onclick="next()">NEXT</button>
</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";
const KEY="cfg";

let config={},data=[],i=0;

window.onload=init;

function init(){
  const s = localStorage.getItem(KEY);
  if(s){
    config = JSON.parse(s);
    loadList();
  } else {
    showScreen("setup");
  }
}

function showScreen(name){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById(name).classList.remove("hidden");
}

function saveConfig(){
  config.novelId=document.getElementById("novelId").value;
  config.reviewId=document.getElementById("reviewId").value;
  localStorage.setItem(KEY,JSON.stringify(config));
  loadList();
}

function loadList(){
  jsonp(API_URL+"?mode=getNovelList&spreadsheetId="+config.novelId)
  .then(list=>{
    const sel=document.getElementById("novelList");
    sel.innerHTML="";
    list.forEach(x=>{
      let o=document.createElement("option");
      o.value=x.name;
      o.textContent=x.name;
      sel.appendChild(o);
    });
    showScreen("select");
  });
}

function openNovel(){
  const sheet=document.getElementById("novelList").value;
  jsonp(API_URL+"?mode=loadNovel&spreadsheetId="+config.novelId+"&sheetName="+sheet)
  .then(r=>{
    data=r;
    i=0;
    showScreen("app");
    render();
  });
}

function render(){
  document.getElementById("current").innerText=data[i]?.english||"END";
}

function next(){
  i++;
  render();
}

function jsonp(url){
  return new Promise(res=>{
    const cb="cb"+Math.random().toString(36).slice(2);
    window[cb]=d=>{
      delete window[cb];
      script.remove();
      res(d);
    };
    const script=document.createElement("script");
    script.src=url+"&callback="+cb;
    document.body.appendChild(script);
  });
}

</script>

</body>
</html>
