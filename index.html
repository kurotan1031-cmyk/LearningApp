<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.hidden{display:none;}

.label{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.current{
  font-size:24px;
  font-weight:bold;
  line-height:1.5;
}

.context{
  font-size:14px;
  color:#666;
  white-space:pre-wrap;
}

textarea,
select{
  width:100%;
  height:70px;
  margin-top:8px;
  padding:10px;
  font-size:14px;
  box-sizing:border-box;
}

select{height:auto;}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.primary{background:#4CAF50;color:#fff;}
.nextBtn{background:#2196F3;color:#fff;}
.changeBtn{background:#666;color:#fff;}
.ttsBtn{background:#ff9800;color:#fff;}

@media (min-width:768px){
  .wrap{max-width:700px;}
  .current{font-size:28px;}
  textarea{height:90px;}
}

</style>
</head>

<body>

<div class="wrap">

<!-- SETUP -->
<div id="setup" class="card hidden">

  <div class="label">初回設定</div>

  <textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
  <textarea id="reviewId" placeholder="ReviewDB ID"></textarea>

  <button class="primary" onclick="saveConfig()">START</button>

</div>

<!-- SELECT -->
<div id="select" class="card hidden">

  <div class="label">Novel Select</div>

  <select id="novelList"></select>

  <button class="primary" onclick="openNovel()">OPEN</button>

  <button class="changeBtn" onclick="changeConfig()">
    Spreadsheet設定変更
  </button>

</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="card">
    <div class="label">Prev</div>
    <div id="prev" class="context"></div>
  </div>

  <div class="card">
    <div class="label">Current</div>
    <div id="current" class="current"></div>
  </div>

  <div class="card">
    <div class="label">Next</div>
    <div id="next" class="context"></div>
  </div>

  <div class="card">

    <textarea id="memo" placeholder="memo"></textarea>
    <textarea id="answer" placeholder="answer"></textarea>

    <div class="card">
      <div class="label">CorrectJP</div>
      <div id="correctJP" class="context"></div>
    </div>

    <button class="ttsBtn" onclick="toggleTTS()" id="ttsBtn">
      🔊 音声ON
    </button>

    <button onclick="prev()">PREV</button>
    <button class="nextBtn" onclick="next()">NEXT</button>
    <button class="primary" onclick="save()">SAVE</button>

    <button class="changeBtn" onclick="changeConfig()">
      Spreadsheet設定変更
    </button>

  </div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

const STORAGE_KEY = "learning_app_config";

let config = {};
let data = [];
let i = 0;

let ttsEnabled = true;
let loading = false;

/* クラッシュ防止 */
window.onerror = function(){
  document.body.innerHTML =
    "<div style='padding:20px'>エラーが発生しました。再読み込みしてください</div>";
};

window.addEventListener("load", init);

async function init(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(!saved){
      showSetup();
      return;
    }

    config = JSON.parse(saved || "{}");

    if(!config.novelId || !config.reviewId){
      showSetup();
      return;
    }

    await loadNovelList();

  }catch(e){
    showSetup();
  }
}

function showSetup(){
  document.getElementById("setup").classList.remove("hidden");
  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.add("hidden");
}

async function saveConfig(){

  config.novelId = document.getElementById("novelId").value.trim();
  config.reviewId = document.getElementById("reviewId").value.trim();

  if(!config.novelId || !config.reviewId){
    alert("IDを入力してください");
    return;
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));

  await loadNovelList();
}

function changeConfig(){
  localStorage.removeItem(STORAGE_KEY);
  config = {};
  showSetup();
}

async function loadNovelList(){

  const list = await jsonp(
    API_URL + "?mode=getNovelList&spreadsheetId=" + config.novelId
  );

  if(!Array.isArray(list)){
    showSetup();
    return;
  }

  const sel = document.getElementById("novelList");
  sel.innerHTML = "";

  list.forEach(n=>{
    const o = document.createElement("option");
    o.value = n.name;
    o.textContent = n.name;
    sel.appendChild(o);
  });

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("select").classList.remove("hidden");
}

async function openNovel(){

  if(loading) return;
  loading = true;

  const sheet = document.getElementById("novelList").value;

  const result = await jsonp(
    API_URL +
    "?mode=loadNovel" +
    "&spreadsheetId=" + config.novelId +
    "&sheetName=" + sheet
  );

  if(!Array.isArray(result)){
    loading = false;
    return;
  }

  data = result;
  i = 0;

  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  render();

  loading = false;
}

async function save(){

  const payload = {
    userId:"local_user",
    novelId:config.novelId,
    sentenceId:i,
    chapter:data[i]?.chapter,
    english:data[i]?.english,
    answer:document.getElementById("answer").value,
    memo:document.getElementById("memo").value,
    time:new Date().toISOString(),
    currentIndex:i,
    novelSpreadsheetId:config.novelId,
    reviewSpreadsheetId:config.reviewId
  };

  await jsonp(
    API_URL +
    "?mode=save" +
    "&reviewSpreadsheetId=" + config.reviewId +
    "&data=" + encodeURIComponent(JSON.stringify(payload))
  );
}

function next(){
  if(i < data.length - 1){
    i++;
    render();
  }
}

function prev(){
  if(i > 0){
    i--;
    render();
  }
}

function render(){

  const curr = data[i]?.english || "";

  document.getElementById("prev").innerText =
    data[i-1]?.english || "";

  document.getElementById("current").innerText =
    curr || "END";

  document.getElementById("next").innerText =
    data[i+1]?.english || "";

  document.getElementById("correctJP").innerText = "";

  if(ttsEnabled && curr){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(curr);
      u.lang = "en-US";
      speechSynthesis.speak(u);
    }catch(e){}
  }
}

function toggleTTS(){
  ttsEnabled = !ttsEnabled;

  document.getElementById("ttsBtn").innerText =
    ttsEnabled ? "🔊 音声ON" : "🔇 音声OFF";

  if(!ttsEnabled){
    speechSynthesis.cancel();
  }
}

/* 安定JSONP */
function jsonp(url){

  return new Promise((resolve)=>{

    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");

    const timeout = setTimeout(()=>{
      cleanup();
      resolve(null);
    }, 10000);

    function cleanup(){
      clearTimeout(timeout);
      delete window[cb];
      if(s.parentNode) s.parentNode.removeChild(s);
    }

    window[cb] = function(res){
      cleanup();
      resolve(res || null);
    };

    s.onerror = function(){
      cleanup();
      resolve(null);
    };

    s.src = url + "&callback=" + cb;
    document.body.appendChild(s);
  });
}

</script>

</body>
</html>
