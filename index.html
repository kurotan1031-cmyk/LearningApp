<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.status{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.current{
  font-size:22px;
  font-weight:bold;
}

.prev,.nextText{
  color:#666;
  white-space:pre-wrap;
  font-size:14px;
}

textarea{
  width:100%;
  height:70px;
  margin-top:8px;
  padding:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.primary{background:#4CAF50;color:#fff}
.nextBtn{background:#2196F3;color:#fff}

@media (min-width:768px){
  .current{font-size:28px}
  textarea{height:90px}
}

.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div class="card">
  <div id="loginBtn"></div>
</div>

<!-- SETUP -->
<div id="setup" class="card hidden">
  <div class="status">初回設定</div>
  <textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
  <textarea id="reviewId" placeholder="ReviewDB ID"></textarea>
  <button class="primary" onclick="saveConfig()">START</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="card">
    <div class="status">Prev</div>
    <div id="prev" class="prev"></div>
  </div>

  <div class="card">
    <div class="status">Current</div>
    <div id="current" class="current"></div>
  </div>

  <div class="card">
    <div class="status">Next</div>
    <div id="next" class="nextText"></div>
  </div>

  <div class="card">
    <textarea id="answer"></textarea>
    <textarea id="memo"></textarea>

    <button class="primary" onclick="save()">SAVE</button>
    <button class="nextBtn" onclick="next()">NEXT</button>
  </div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId="";
let config={};
let data=[];
let i=0;

/* LOGIN */
function initLogin(){

  if(!window.google || !google.accounts){
    setTimeout(initLogin,50);
    return;
  }

  google.accounts.id.initialize({
    client_id:"9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com",
    callback:handleLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("loginBtn"),
    {theme:"outline",size:"large"}
  );
}

window.addEventListener("load",initLogin);

/* LOGIN HANDLER */
function handleLogin(res){

  const p=JSON.parse(atob(res.credential.split('.')[1]));
  userId=p.sub||p.email;

  document.getElementById("setup").classList.remove("hidden");
}

/* SAVE CONFIG */
async function saveConfig(){

  config.novelId=document.getElementById("novelId").value.trim();
  config.reviewId=document.getElementById("reviewId").value.trim();

  const list=await jsonp(
    `${API_URL}?mode=getNovelList&spreadsheetId=${config.novelId}`
  );

  // 今回はUI変更なしなのでそのまま最初のシートを使う
  const sheet=list[0]?.name;

  loadNovel(sheet);
}

/* LOAD NOVEL */
async function loadNovel(sheet){

  data=await jsonp(
    `${API_URL}?mode=loadNovel`
    +`&spreadsheetId=${config.novelId}`
    +`&sheetName=${sheet}`
  );

  i=0;

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  render();
}

/* RENDER（完全維持） */
function render(){

  document.getElementById("current").innerText=data[i]?.english||"END";

  document.getElementById("prev").innerText=
    (data[i-1]?.english||"") + "\n" +
    (data[i-2]?.english||"");

  document.getElementById("next").innerText=
    (data[i+1]?.english||"") + "\n" +
    (data[i+2]?.english||"");
}

/* SAVE */
async function save(){

  const d=data[i];

  await jsonp(
    `${API_URL}?mode=save`
    +`&reviewSpreadsheetId=${config.reviewId}`
    +`&data=${encodeURIComponent(JSON.stringify({
      userId,
      novelId:config.novelId,
      sentenceId:i,
      chapter:d.chapter,
      english:d.english,
      answer:answer.value,
      memo:memo.value,
      time:new Date().toISOString(),
      currentIndex:i,
      novelSpreadsheetId:config.novelId,
      reviewSpreadsheetId:config.reviewId
    }))}`
  );
}

/* NEXT */
function next(){
  if(i<data.length-1){
    i++;
    render();
  }
}

/* JSONP */
function jsonp(url){

  return new Promise(res=>{

    const cb="cb_"+Math.random().toString(36).slice(2);

    window[cb]=r=>{
      delete window[cb];
      document.body.removeChild(s);
      res(r);
    };

    const s=document.createElement("script");
    s.src=url+"&callback="+cb;
    document.body.appendChild(s);
  });
}

</script>

</body>
</html>
