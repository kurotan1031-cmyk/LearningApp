<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.wrap{max-width:900px;margin:auto;padding:16px;}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.hidden{display:none;}

.current{font-size:24px;font-weight:bold;margin-bottom:10px;}

button{
  width:100%;
  padding:10px;
  margin-top:6px;
}

.row{
  display:flex;
  gap:6px;
}

.smallbtn{
  flex:1;
}

.label{
  font-weight:bold;
  margin-top:8px;
}

</style>
</head>

<body>

<div class="wrap">

<!-- ID入力 -->
<div id="setup" class="card hidden">
  <textarea id="novelId" placeholder="Novel ID"></textarea>
  <textarea id="reviewId" placeholder="Review ID"></textarea>
  <button onclick="saveConfig()">START</button>
</div>

<!-- 小説選択 -->
<div id="select" class="card hidden">
  <select id="novelList"></select>
  <button onclick="openNovel()">START</button>
</div>

<!-- 学習画面（夕方フルUI） -->
<div id="app" class="hidden">

  <div class="card">

    <div id="current" class="current"></div>

    <div class="label">CorrectJP</div>
    <div id="correctJP"></div>

    <div class="label">Note</div>
    <div id="note"></div>

  </div>

  <div class="row">
    <button class="smallbtn" onclick="prev()">PREV</button>
    <button class="smallbtn" onclick="next()">NEXT</button>
  </div>

  <button onclick="speak()">SPEAK</button>
  <button onclick="markGood()">GOOD</button>
  <button onclick="markBad()">BAD</button>

</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";
const KEY="cfg";

let config={},data=[],i=0;

window.onload=init;

/* ★安定版init */
function init(){
  const s = localStorage.getItem(KEY);

  if(s){
    config = JSON.parse(s);
    loadList();
  } else {
    showScreen("setup");
  }
}

/* 画面制御 */
function showScreen(name){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById(name).classList.remove("hidden");
}

/* 保存 */
function saveConfig(){
  config.novelId=document.getElementById("novelId").value;
  config.reviewId=document.getElementById("reviewId").value;
  localStorage.setItem(KEY,JSON.stringify(config));
  loadList();
}

/* リスト */
function loadList(){
  jsonp(API_URL+"?mode=getNovelList&spreadsheetId="+config.novelId)
  .then(list=>{
    const sel=document.getElementById("novelList");
    sel.innerHTML="";
    list.forEach(x=>{
      let o=document.createElement("option");
      o.value=x.name;
      o.textContent=x.name;
      sel.appendChild(o);
    });
    showScreen("select");
  });
}

/* 開始 */
function openNovel(){
  const sheet=document.getElementById("novelList").value;

  jsonp(API_URL+"?mode=loadNovel&spreadsheetId="+config.novelId+"&sheetName="+sheet)
  .then(r=>{
    data=r;
    i=0;
    showScreen("app");
    render();
  });
}

/* 表示 */
function render(){
  let d = data[i] || {};

  document.getElementById("current").innerText = d.english || "END";
  document.getElementById("correctJP").innerText = d.correctJP || "";
  document.getElementById("note").innerText = d.note || "";
}

/* 操作 */
function next(){ i++; render(); }
function prev(){ i = Math.max(0, i-1); render(); }

function speak(){
  const t = data[i]?.english;
  if(t) speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}

function markGood(){}
function markBad(){}

/* JSONP */
function jsonp(url){
  return new Promise(res=>{
    const cb="cb"+Math.random().toString(36).slice(2);
    window[cb]=d=>{
      delete window[cb];
      script.remove();
      res(d);
    };
    const script=document.createElement("script");
    script.src=url+"&callback="+cb;
    document.body.appendChild(script);
  });
}

</script>

</body>
</html>
