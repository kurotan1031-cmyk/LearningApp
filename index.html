<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;margin:0}
.wrap{max-width:800px;margin:auto;padding:20px}
.card{margin:10px 0}
textarea{width:100%;height:80px}
.prev,.next{color:#777;white-space:pre-wrap}
.current{font-size:22px;margin:10px 0}
button{margin:5px}
</style>
</head>

<body>

<div class="wrap">

<div id="login"></div>

<div id="setup" style="display:none">
<h3>初回設定</h3>
<textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
<textarea id="reviewId" placeholder="ReviewDB ID"></textarea>
<button onclick="saveSetup()">保存</button>
</div>

<div id="app" style="display:none">

<div id="prev"></div>
<div id="current" class="current"></div>
<div id="next"></div>

<textarea id="answer"></textarea>
<textarea id="memo"></textarea>

<button onclick="check()">OK</button>
<button onclick="next()">NEXT</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/execWQXOri_e9v8Qbo78p8OmRk23o9uikPE3J5GFFt-30";

let userId="";
let config={};
let data=[];
let i=0;

/* login */
function handleCredentialResponse(res){

  const p=JSON.parse(atob(res.credential.split('.')[1]));
  userId=p.email;

  restore();
}

/* restore */
async function restore(){

  const r=await fetch(`${API}?mode=restore&userId=${userId}&reviewSpreadsheetId=${config.reviewSpreadsheetId||""}`);
  const j=await r.json();

  if(j.first){
    document.getElementById("setup").style.display="block";
    return;
  }

  loadNovel(j.novelId,j.currentIndex||0);
}

/* save setup */
async function saveSetup(){

  config.novelSpreadsheetId=document.getElementById("novelId").value;
  config.reviewSpreadsheetId=document.getElementById("reviewId").value;

  document.getElementById("setup").style.display="none";

}

/* load */
async function loadNovel(sheet,start){

  const r=await fetch(`${API}?mode=loadNovel&sheet=${sheet}&spreadsheetId=${config.novelSpreadsheetId}`);
  data=await r.json();

  i=start;

  render();

  document.getElementById("app").style.display="block";
}

/* render */
function render(){

  const d=data[i];

  document.getElementById("current").innerText=d.english;

  document.getElementById("prev").innerText=
    (data[i-1]?.english||"")+"\n"+(data[i-2]?.english||"");

  document.getElementById("next").innerText=
    (data[i+1]?.english||"")+"\n"+(data[i+2]?.english||"");
}

/* check */
async function check(){

  const d=data[i];

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      userId,
      novelId:d.chapter,
      sentenceId:i,
      chapter:d.chapter,
      english:d.english,
      answer:document.getElementById("answer").value,
      memo:document.getElementById("memo").value,
      time:new Date().toISOString(),
      currentIndex:i,
      novelSpreadsheetId:config.novelSpreadsheetId,
      reviewSpreadsheetId:config.reviewSpreadsheetId
    })
  });

}

/* next */
function next(){
  if(i<data.length-1){
    i++;
    render();
  }
}

</script>

</body>
</html>
