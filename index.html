<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LearningApp</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

.card{
  max-width:720px;
  margin:20px auto;
  padding:20px;
}

.titleCard{
  padding:12px;
  border:1px solid #ddd;
  margin:8px 0;
  cursor:pointer;
}

.meta{
  font-size:13px;
  color:#666;
  margin-bottom:20px;
}

.prev,
.next{
  font-size:16px;
  color:#777;
  line-height:1.5;
  margin:8px 0;
  white-space:pre-wrap;
}

.current{
  font-size:22px;
  color:#111;
  line-height:1.6;
  margin:14px 0;
}

textarea{
  width:100%;
  min-height:70px;
}

button{
  padding:10px;
  margin:5px 5px 5px 0;
}

.label{
  font-size:12px;
  color:#666;
  margin-top:10px;
}

#correct{
  color:#444;
  white-space:pre-wrap;
  line-height:1.6;
}

.note{
  white-space:pre-wrap;
  color:#444;
  line-height:1.5;
}

@media (max-width:767px){

  .card{
    padding:16px;
  }

  .current{
    font-size:20px;
  }

  .prev,
  .next{
    font-size:14px;
  }
}

</style>
</head>

<body>

<div class="card">

<div id="setupView">

<h2>Setup</h2>

<div class="label">
NovelLibrary Spreadsheet ID
</div>

<textarea id="novelId"></textarea>

<div class="label">
ReviewDB Spreadsheet ID
</div>

<textarea id="reviewId"></textarea>

<button onclick="startFirstSetup()">
START
</button>

</div>

<div id="indexView"></div>

<div id="readView" style="display:none;">

<div class="meta" id="meta"></div>

<div class="prev" id="prev"></div>

<div class="current" id="current"></div>

<div class="next" id="next"></div>

<hr>

<div class="label">
Answer
</div>

<textarea id="answer"></textarea>

<div class="label">
CorrectJP
</div>

<div id="correct"></div>

<div class="label">
Memo
</div>

<div class="note" id="note"></div>

<button onclick="backSentence()">
BACK
</button>

<button onclick="checkAnswer()">
CHECK
</button>

<button onclick="nextSentence()">
NEXT
</button>

<button onclick="goIndex()">
NovelSelect
</button>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/execWQXOri_e9v8Qbo78p8OmRk23o9uikPE3J5GFFt-30";

let config = {

  novelSpreadsheetId:"",
  reviewSpreadsheetId:""

};

let state = {

  novels:[],
  data:[],
  index:0,
  selectedNovel:""

};

/* =========================
   AUTO RESTORE
========================= */

window.onload = async ()=>{

  const reviewId =
    prompt(
      "ReviewDB Spreadsheet ID"
    );

  if(!reviewId) return;

  const res = await fetch(

`${API_URL}?mode=restore&reviewSpreadsheetId=${reviewId}`

  );

  const json = await res.json();

  if(json.first){

    document.getElementById(
      "setupView"
    ).style.display = "block";

    return;
  }

  config.novelSpreadsheetId =
    json.novelSpreadsheetId;

  config.reviewSpreadsheetId =
    json.reviewSpreadsheetId;

  await loadIndex();

  await loadNovel(
    json.novelId,
    json.currentIndex
  );
};

/* =========================
   FIRST SETUP
========================= */

async function startFirstSetup(){

  config.novelSpreadsheetId =
    document.getElementById(
      "novelId"
    ).value.trim();

  config.reviewSpreadsheetId =
    document.getElementById(
      "reviewId"
    ).value.trim();

  await loadIndex();

  document.getElementById(
    "setupView"
  ).style.display = "none";
}

/* =========================
   LOAD INDEX
========================= */

async function loadIndex(){

  const res = await fetch(

`${API_URL}?mode=list&spreadsheetId=${config.novelSpreadsheetId}`

  );

  state.novels = await res.json();

  renderIndex();
}

/* =========================
   RENDER INDEX
========================= */

function renderIndex(){

  let html =
    "<h2>Novel List</h2>";

  state.novels.forEach(n=>{

    html += `

<div class="titleCard"
onclick="loadNovel('${n.title}',0)">
${n.title}
</div>

`;

  });

  document.getElementById(
    "indexView"
  ).innerHTML = html;
}

/* =========================
   LOAD NOVEL
========================= */

async function loadNovel(
  title,
  startIndex
){

  const res = await fetch(

`${API_URL}?mode=loadNovel&sheet=${encodeURIComponent(title)}&spreadsheetId=${config.novelSpreadsheetId}`

  );

  state.data = await res.json();

  state.selectedNovel = title;

  state.index = startIndex || 0;

  document.getElementById(
    "indexView"
  ).style.display = "none";

  document.getElementById(
    "readView"
  ).style.display = "block";

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const d =
    state.data[state.index];

  if(!d) return;

  document.getElementById(
    "meta"
  ).innerText =

`${state.selectedNovel}
${state.index+1}/${state.data.length}`;

  const prevTexts = [];

  if(state.data[state.index-2]){
    prevTexts.push(
      state.data[state.index-2].english
    );
  }

  if(state.data[state.index-1]){
    prevTexts.push(
      state.data[state.index-1].english
    );
  }

  document.getElementById(
    "prev"
  ).innerText =
    prevTexts.join("\n");

  document.getElementById(
    "current"
  ).innerText =
    d.english;

  const nextTexts = [];

  if(state.data[state.index+1]){
    nextTexts.push(
      state.data[state.index+1].english
    );
  }

  if(state.data[state.index+2]){
    nextTexts.push(
      state.data[state.index+2].english
    );
  }

  document.getElementById(
    "next"
  ).innerText =
    nextTexts.join("\n");

  document.getElementById(
    "correct"
  ).innerText =
    d.correctJP;

  document.getElementById(
    "note"
  ).innerText =
    d.note || "";
}

/* =========================
   SAVE
========================= */

async function checkAnswer(){

  const d =
    state.data[state.index];

  await fetch(

`${API_URL}?spreadsheetId=${config.reviewSpreadsheetId}`,

{
  method:"POST",

  headers:{
    "Content-Type":"application/json"
  },

  body:JSON.stringify({

    novelId:
      state.selectedNovel,

    sentenceId:
      d.sentenceId,

    chapter:
      d.chapter,

    english:
      d.english,

    answer:
      document.getElementById(
        "answer"
      ).value,

    memo:
      document.getElementById(
        "memo"
      ).value,

    time:
      new Date().toISOString(),

    currentIndex:
      state.index,

    novelSpreadsheetId:
      config.novelSpreadsheetId,

    reviewSpreadsheetId:
      config.reviewSpreadsheetId

  })
});

}

/* =========================
   NAV
========================= */

function nextSentence(){

  if(
    state.index <
    state.data.length-1
  ){

    state.index++;

    render();
  }
}

function backSentence(){

  if(state.index > 0){

    state.index--;

    render();
  }
}

function goIndex(){

  document.getElementById(
    "readView"
  ).style.display = "none";

  document.getElementById(
    "indexView"
  ).style.display = "block";
}

</script>

</body>
</html>
