<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

textarea,select,button{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:10px;
}

button{
  border:none;
  border-radius:8px;
  background:#4CAF50;
  color:#fff;
}

.current{
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

  <div id="g_id_onload"
       data-client_id="9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"></div>

</div>

<div id="setup"
     class="card"
     style="display:none">

  <textarea id="novelId"
    placeholder="NovelLibrary Spreadsheet ID"></textarea>

  <textarea id="reviewId"
    placeholder="ReviewDB Spreadsheet ID"></textarea>

  <button onclick="saveSetup()">
    START
  </button>

</div>

<div id="novelWrap"
     class="card"
     style="display:none">

  <select id="novelSelect"></select>

  <button onclick="loadSelectedNovel()">
    OPEN NOVEL
  </button>

</div>

<div id="app"
     class="card"
     style="display:none">

  <div id="current"
       class="current"></div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let config = {};

let novels = [];

let novelData = [];

/* LOGIN */
function handleCredentialResponse(){

  document.getElementById("setup")
    .style.display = "block";
}

/* START */
async function saveSetup(){

  try{

    const novelId =
      document.getElementById("novelId")
        .value
        .trim();

    const reviewId =
      document.getElementById("reviewId")
        .value
        .trim();

    if(!novelId || !reviewId){

      alert("ID入力");

      return;
    }

    config.novelSpreadsheetId = novelId;
    config.reviewSpreadsheetId = reviewId;

    const url =
      API_URL
      + "?mode=getNovelList"
      + "&spreadsheetId="
      + encodeURIComponent(novelId);

    const r =
      await fetch(url);

    const j =
      await r.json();

    console.log(j);

    if(j.status === "error"){

      alert(j.message);

      return;
    }

    novels = j;

    const sel =
      document.getElementById("novelSelect");

    sel.innerHTML = "";

    novels.forEach(n=>{

      const op =
        document.createElement("option");

      op.value = n.name;

      op.textContent = n.name;

      sel.appendChild(op);
    });

    document.getElementById("setup")
      .style.display = "none";

    document.getElementById("novelWrap")
      .style.display = "block";

  }catch(err){

    console.error(err);

    alert(String(err));
  }
}

/* LOAD NOVEL */
async function loadSelectedNovel(){

  try{

    const sheetName =
      document.getElementById("novelSelect")
        .value;

    const url =
      API_URL
      + "?mode=loadNovel"
      + "&spreadsheetId="
      + encodeURIComponent(config.novelSpreadsheetId)
      + "&sheetName="
      + encodeURIComponent(sheetName);

    const r =
      await fetch(url);

    const j =
      await r.json();

    console.log(j);

    if(j.status === "error"){

      alert(j.message);

      return;
    }

    novelData = j;

    document.getElementById("novelWrap")
      .style.display = "none";

    document.getElementById("app")
      .style.display = "block";

    document.getElementById("current")
      .innerText =
        novelData[0]?.english || "NO DATA";

  }catch(err){

    console.error(err);

    alert(String(err));
  }
}

</script>

</body>
</html>
