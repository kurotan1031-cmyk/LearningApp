<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LearningApp</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#ffffff;
  font-size:18px;
}

.card{
  max-width:850px;
  margin:30px auto;
  background:#fff;
  padding:30px;
  border-radius:12px;
}

.titleCard{
  padding:12px;
  border:1px solid #ddd;
  margin:8px 0;
  cursor:pointer;
}

.current{
  font-size:26px;
  font-weight:bold;
  margin:80px 0 40px 0;
  text-align:center;
  line-height:1.5;
}

.prev,.next{
  color:#999;
  font-size:14px;
  text-align:center;
}

textarea{
  width:100%;
  height:60px;
}

button{
  padding:10px;
  margin:5px;
}

.note{
  font-size:13px;
  white-space:pre-wrap;
  color:#333;
}

.label{
  font-size:12px;
  color:#666;
  margin-top:10px;
}

#indexView{
  display:none;
}

#readView{
  display:none;
}

</style>
</head>

<body>

<div class="card">

  <!-- =========================
       SETUP
  ========================== -->
  <div id="setupView">

    <h2>Setup</h2>

    <div class="label">
      NovelLibrary Spreadsheet ID
    </div>

    <textarea id="novelId"></textarea>

    <div class="label">
      ReviewDB Spreadsheet ID
    </div>

    <textarea id="reviewId"></textarea>

    <button onclick="startApp()">
      START
    </button>

  </div>

  <!-- =========================
       INDEX
  ========================== -->
  <div id="indexView"></div>

  <!-- =========================
       READER
  ========================== -->
  <div id="readView">

    <div class="prev" id="prev"></div>

    <div class="current" id="current"></div>

    <div class="next" id="next"></div>

    <div class="label">Memo</div>
    <textarea id="memo"></textarea>

    <div class="label">Your Answer</div>
    <textarea id="answer"></textarea>

    <div class="label">Correct Answer</div>
    <div id="correct"></div>

    <div class="label">Note</div>
    <div class="note" id="note"></div>

    <button onclick="backSentence()">
      BACK
    </button>

    <button onclick="checkAnswer()">
      CHECK
    </button>

    <button onclick="nextSentence()">
      NEXT
    </button>

    <button onclick="goIndex()">
      SELECT
    </button>

  </div>

</div>

<script>

/* =========================
   API
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

/* =========================
   CONFIG
========================= */

let config = {

  novelId: "",
  reviewId: ""

};

/* =========================
   STATE
========================= */

let state = {

  novels: [],
  data: [],
  index: 0,
  selectedNovel: "",
  sessionId: getSession()

};

/* =========================
   SESSION
========================= */

function getSession(){

  let id =
    localStorage.getItem("sessionId");

  if(!id){

    id = "S_" + Date.now();

    localStorage.setItem(
      "sessionId",
      id
    );
  }

  return id;
}

/* =========================
   START
========================= */

async function startApp(){

  config.novelId =
    document.getElementById(
      "novelId"
    ).value.trim();

  config.reviewId =
    document.getElementById(
      "reviewId"
    ).value.trim();

  await loadIndex();

  document.getElementById(
    "setupView"
  ).style.display = "none";

  document.getElementById(
    "indexView"
  ).style.display = "block";
}

/* =========================
   LOAD INDEX
========================= */

async function loadIndex(){

  const res = await fetch(

    `${API_URL}?mode=list&spreadsheetId=${config.novelId}`

  );

  const json = await res.json();

  state.novels = json;

  renderIndex();
}

/* =========================
   RENDER INDEX
========================= */

function renderIndex(){

  let html = "<h2>Novel List</h2>";

  state.novels.forEach(n=>{

    html += `

      <div
        class="titleCard"
        onclick="loadNovel('${n.title}')"
      >
        ${n.title}
      </div>

    `;
  });

  document.getElementById(
    "indexView"
  ).innerHTML = html;
}

/* =========================
   LOAD NOVEL
========================= */

async function loadNovel(title){

  const res = await fetch(

    `${API_URL}?sheet=${encodeURIComponent(title)}&spreadsheetId=${config.novelId}`

  );

  const json = await res.json();

  state.data = json;

  state.index = 0;

  state.selectedNovel = title;

  document.getElementById(
    "indexView"
  ).style.display = "none";

  document.getElementById(
    "readView"
  ).style.display = "block";

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const d =
    state.data[state.index];

  if(!d) return;

  document.getElementById(
    "current"
  ).innerText = d.english;

  document.getElementById(
    "prev"
  ).innerText =

    state.data[state.index-1]
    ?.english || "";

  document.getElementById(
    "next"
  ).innerText =

    state.data[state.index+1]
    ?.english || "";

  document.getElementById(
    "correct"
  ).innerText = "";

  document.getElementById(
    "note"
  ).innerText = "";

  document.getElementById(
    "answer"
  ).value =

    localStorage.getItem(
      "ans_" + d.sentenceId
    ) || "";

  document.getElementById(
    "memo"
  ).value =

    localStorage.getItem(
      "memo_" + d.sentenceId
    ) || "";

  speak(d.english);
}

/* =========================
   TTS
========================= */

function speak(text){

  const u =
    new SpeechSynthesisUtterance(text);

  u.lang = "en-US";

  u.rate = 0.9;

  speechSynthesis.cancel();

  speechSynthesis.speak(u);
}

/* =========================
   SAVE
========================= */

function save(){

  const d =
    state.data[state.index];

  localStorage.setItem(

    "ans_" + d.sentenceId,

    document.getElementById(
      "answer"
    ).value

  );

  localStorage.setItem(

    "memo_" + d.sentenceId,

    document.getElementById(
      "memo"
    ).value

  );
}

/* =========================
   CHECK
========================= */

async function checkAnswer(){

  const d =
    state.data[state.index];

  const answer =
    document.getElementById(
      "answer"
    ).value;

  const memo =
    document.getElementById(
      "memo"
    ).value;

  document.getElementById(
    "correct"
  ).innerText = d.correctJP;

  document.getElementById(
    "note"
  ).innerText = d.note;

  await fetch(

    `${API_URL}?spreadsheetId=${config.reviewId}`,

    {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body: JSON.stringify({

        sessionId:
          state.sessionId,

        novelTitle:
          state.selectedNovel,

        sentenceId:
          d.sentenceId,

        chapter:
          d.chapter,

        english:
          d.english,

        answer,
        memo,

        time:
          new Date().toISOString()

      })

    }

  );

  save();
}

/* =========================
   NEXT
========================= */

function nextSentence(){

  save();

  if(
    state.index <
    state.data.length - 1
  ){

    state.index++;

    render();
  }
}

/* =========================
   BACK
========================= */

function backSentence(){

  save();

  if(state.index > 0){

    state.index--;

    render();
  }
}

/* =========================
   SELECT
========================= */

function goIndex(){

  save();

  document.getElementById(
    "readView"
  ).style.display = "none";

  document.getElementById(
    "indexView"
  ).style.display = "block";
}

</script>

</body>
</html>
