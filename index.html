<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.hidden{display:none;}

.label{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.current{
  font-size:24px;
  font-weight:bold;
  line-height:1.5;
}

.context{
  font-size:14px;
  color:#666;
  white-space:pre-wrap;
}

textarea,
select{
  width:100%;
  height:70px;
  margin-top:8px;
  padding:10px;
  font-size:14px;
  box-sizing:border-box;
}

select{height:auto;}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.primary{background:#4CAF50;color:#fff;}
.nextBtn{background:#2196F3;color:#fff;}
.changeBtn{background:#666;color:#fff;}
.ttsBtn{background:#ff9800;color:#fff;}

@media (min-width:768px){
  .wrap{max-width:700px;}
  .current{font-size:28px;}
  textarea{height:90px;}
}

</style>
</head>

<body>

<div class="wrap">

<!-- SETUP -->
<div id="setup" class="card hidden">

  <div class="label">初回設定</div>

  <textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
  <textarea id="reviewId" placeholder="ReviewDB ID"></textarea>

  <button class="primary" onclick="saveConfig()">START</button>

</div>

<!-- SELECT -->
<div id="select" class="card hidden">

  <div class="label">Novel Select</div>

  <select id="novelList"></select>

  <button class="primary" onclick="openNovel()">OPEN</button>

  <button class="changeBtn" onclick="changeConfig()">
    Spreadsheet設定変更
  </button>

</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="card">
    <div class="label">Prev</div>
    <div id="prev" class="context"></div>
  </div>

  <div class="card">
    <div class="label">Current</div>
    <div id="current" class="current"></div>
  </div>

  <div class="card">
    <div class="label">Next</div>
    <div
