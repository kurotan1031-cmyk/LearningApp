<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.status{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.current{
  font-size:22px;
  font-weight:bold;
}

.prev,.nextText{
  color:#666;
  white-space:pre-wrap;
  font-size:14px;
}

textarea{
  width:100%;
  height:70px;
  margin-top:8px;
  padding:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

.primary{background:#4CAF50;color:#fff}
.nextBtn{background:#2196F3;color:#fff}

@media (min-width:768px){
  .current{font-size:28px}
  textarea{height:90px}
}

@media (max-width:767px){
  button{width:100%}
}
</style>

</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div class="card">
  <div class="status">Login</div>

  <div id="g_id_onload"
       data-client_id="9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"></div>
</div>

<!-- SETUP -->
<div id="setup" class="card" style="display:none">

  <div class="status">初回設定</div>

  <textarea id="novelId" placeholder="Novel Spreadsheet ID"></textarea>
  <textarea id="reviewId" placeholder="Review Spreadsheet ID"></textarea>

  <button class="primary" onclick="saveSetup()">START</button>

</div>

<!-- APP -->
<div id="app" style="display:none">

  <div class="card">
    <div class="status">Prev</div>
    <div id="prev" class="prev"></div>
  </div>

  <div class="card">
    <div class="status">Current</div>
    <div id="current" class="current"></div>
  </div>

  <div class="card">
    <div class="status">Next</div>
    <div id="next" class="nextText"></div>
  </div>

  <div class="card">

    <textarea id="answer"></textarea>
    <textarea id="memo"></textarea>

    <button class="primary" onclick="save()">SAVE</button>
    <button class="nextBtn" onclick="next()">NEXT</button>

  </div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {
  novelSpreadsheetId: "",
  reviewSpreadsheetId: ""
};

let data = [];
let i = 0;

/* LOGIN */
function handleCredentialResponse(res){
  const payload = JSON.parse(atob(res.credential.split('.')[1]));
  userId = payload.email;

  restore();
}

/* RESTORE */
async function restore(){

  const r = await fetch(`${API_URL}?mode=restore&userId=${userId}&reviewSpreadsheetId=${config.reviewSpreadsheetId}`);
  const j = await r.json();

  if(j.first || !j.novelId || !j.reviewSpreadsheetId){
    document.getElementById("setup").style.display = "block";
    document.getElementById("app").style.display = "none";
    return;
  }

  config.novelSpreadsheetId = j.novelId;
  config.reviewSpreadsheetId = j.reviewSpreadsheetId;

  loadNovel(j.novelId, j.currentIndex || 0);
}

/* SETUP SAVE（完全安定版） */
function saveSetup(){

  const novel = document.getElementById("novelId").value.trim();
  const review = document.getElementById("reviewId").value.trim();

  if(!novel || !review){
    alert("IDを両方入力してください");
    return;
  }

  config.novelSpreadsheetId = novel;
  config.reviewSpreadsheetId = review;

  document.getElementById("setup").style.display = "none";

  loadNovel(novel, 0);
}

/* LOAD */
async function loadNovel(sheet,start){

  const r = await fetch(`${API_URL}?mode=loadNovel&sheet=${sheet}&spreadsheetId=${config.novelSpreadsheetId}`);
  data = await r.json();

  i = start;

  document.getElementById("app").style.display = "block";

  render();
}

/* RENDER */
function render(){

  if(!data[i]) return;

  document.getElementById("current").innerText = data[i].english;

  document.getElementById("prev").innerText =
    (data[i-1]?.english || "") + "\n" + (data[i-2]?.english || "");

  document.getElementById("next").innerText =
    (data[i+1]?.english || "") + "\n" + (data[i+2]?.english || "");
}

/* SAVE */
async function save(){

  const d = data[i];

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      userId,
      novelId:d.chapter,
      sentenceId:i,
      chapter:d.chapter,
      english:d.english,
      answer:answer.value,
      memo:memo.value,
      time:new Date().toISOString(),
      currentIndex:i,
      reviewSpreadsheetId:config.reviewSpreadsheetId
    })
  });

}

/* NEXT */
function next(){
  if(i < data.length - 1){
    i++;
    render();
  }
}

</script>

</body>
</html>
