<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LearningApp</title>

<style>

/* =========================
   BASE
========================= */

body{
  margin:0;
  font-family:Arial;
  background:#ffffff;
  font-size:16px;
  color:#111;
}

.card{
  max-width:900px;
  margin:20px auto;
  padding:20px;
}

/* =========================
   INDEX / SETUP
========================= */

.titleCard{
  padding:10px;
  border:1px solid #ddd;
  margin:6px 0;
  cursor:pointer;
}

/* =========================
   TEXT AREAS
========================= */

textarea{
  width:100%;
  height:60px;
}

/* =========================
   BUTTONS
========================= */

button{
  padding:8px 12px;
  margin:5px 5px 5px 0;
}

/* =========================
   TEXT BLOCKS
========================= */

.prev, .next{
  font-size:16px;
  color:#777;
  margin:8px 0;
  line-height:1.5;
}

.current{
  font-size:22px;
  font-weight:normal;
  color:#111;
  margin:12px 0;
  line-height:1.6;
}

/* =========================
   MEMO AREA
========================= */

.note{
  font-size:13px;
  white-space:pre-wrap;
  color:#444;
}

/* =========================
   LABEL
========================= */

.label{
  font-size:12px;
  color:#666;
  margin-top:10px;
}

/* =========================
   PC OPTIMIZATION
========================= */

@media (min-width: 768px){

  body{
    font-size:16px;
  }

  .card{
    max-width:720px;   /* ← 余白対策 */
  }

  .current{
    font-size:22px;
  }

  .prev, .next{
    font-size:16px;
  }

  textarea{
    height:70px;
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 767px){

  .card{
    max-width:100%;
    padding:16px;
  }

  .current{
    font-size:20px;
  }

  .prev, .next{
    font-size:14px;
  }
}

</style>
</head>

<body>

<div class="card">

  <!-- SETUP -->
  <div id="setupView">
    <h2>Setup</h2>

    <div class="label">NovelLibrary Spreadsheet ID</div>
    <textarea id="novelId"></textarea>

    <div class="label">ReviewDB Spreadsheet ID</div>
    <textarea id="reviewId"></textarea>

    <button onclick="startApp()">START</button>
  </div>

  <!-- INDEX -->
  <div id="indexView"></div>

  <!-- READING -->
  <div id="readView" style="display:none;">

    <div class="prev" id="prev"></div>

    <div class="current" id="current"></div>

    <div class="next" id="next"></div>

    <hr>

    <div class="label">Answer（日本語OK・思考ログ）</div>
    <textarea id="answer"></textarea>

    <div class="label">CorrectJP</div>
    <div id="correct"></div>

    <div class="label">Memo</div>
    <textarea id="memo"></textarea>

    <button onclick="backSentence()">BACK</button>
    <button onclick="checkAnswer()">CHECK</button>
    <button onclick="nextSentence()">NEXT</button>
    <button onclick="goIndex()">SELECT</button>

  </div>

</div>

<script>

/* =========================
   API
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

/* =========================
   STATE
========================= */

let config = {
  novelId:"",
  reviewId:""
};

let state = {
  novels:[],
  data:[],
  index:0,
  selectedNovel:"",
  sessionId:"S_" + Date.now()
};

/* =========================
   START
========================= */

async function startApp(){

  config.novelId =
    document.getElementById("novelId").value.trim();

  config.reviewId =
    document.getElementById("reviewId").value.trim();

  await loadIndex();

  document.getElementById("setupView").style.display="none";
}

/* =========================
   LOAD INDEX
========================= */

async function loadIndex(){

  const res = await fetch(
    `${API_URL}?mode=list&spreadsheetId=${config.novelId}`
  );

  state.novels = await res.json();

  renderIndex();
}

/* =========================
   INDEX
========================= */

function renderIndex(){

  let html = "<h2>Novel List</h2>";

  state.novels.forEach(n=>{
    html += `
      <div class="titleCard"
        onclick="loadNovel('${n.title}')">
        ${n.title}
      </div>`;
  });

  document.getElementById("indexView").innerHTML = html;
}

/* =========================
   LOAD NOVEL
========================= */

async function loadNovel(title){

  const res = await fetch(
    `${API_URL}?sheet=${encodeURIComponent(title)}&spreadsheetId=${config.novelId}`
  );

  state.data = await res.json();
  state.index = 0;
  state.selectedNovel = title;

  document.getElementById("indexView").style.display="none";
  document.getElementById("readView").style.display="block";

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const d = state.data[state.index];
  if(!d) return;

  document.getElementById("current").innerText = d.english;
  document.getElementById("prev").innerText =
    state.data[state.index-1]?.english || "";

  document.getElementById("next").innerText =
    state.data[state.index+1]?.english || "";

  document.getElementById("correct").innerText = d.correctJP;

  document.getElementById("answer").value = "";
  document.getElementById("memo").value = "";
}

/* =========================
   CHECK
========================= */

async function checkAnswer(){

  const d = state.data[state.index];

  await fetch(
    `${API_URL}?spreadsheetId=${config.reviewId}`,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        sessionId:state.sessionId,
        novelTitle:state.selectedNovel,
        sentenceId:d.sentenceId,
        chapter:d.chapter,
        english:d.english,
        answer:document.getElementById("answer").value,
        memo:document.getElementById("memo").value,
        time:new Date().toISOString()
      })
    }
  );
}

/* =========================
   NAV
========================= */

function nextSentence(){
  if(state.index < state.data.length-1){
    state.index++;
    render();
  }
}

function backSentence(){
  if(state.index > 0){
    state.index--;
    render();
  }
}

function goIndex(){
  document.getElementById("readView").style.display="none";
  document.getElementById("indexView").style.display="block";
}

</script>

</body>
</html>
