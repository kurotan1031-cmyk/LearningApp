<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;margin:0}
.wrap{max-width:900px;margin:auto;padding:20px}

.current{
  font-size:22px;
  margin:10px 0;
}

.prev,.next{
  color:#777;
  white-space:pre-wrap;
  font-size:14px;
}

textarea{
  width:100%;
  height:70px;
  margin-top:10px;
}

button{margin:5px}
</style>
</head>

<body>

<div class="wrap">

<div id="login"></div>

<div id="setup" style="display:none">
<h3>初回設定</h3>
<textarea id="novelId" placeholder="Novel Spreadsheet ID"></textarea>
<textarea id="reviewId" placeholder="ReviewDB Spreadsheet ID"></textarea>
<button onclick="saveSetup()">保存</button>
</div>

<div id="app" style="display:none">

<div id="prev" class="prev"></div>
<div id="current" class="current"></div>
<div id="next" class="next"></div>

<textarea id="answer" placeholder="answer"></textarea>
<textarea id="memo" placeholder="memo"></textarea>

<button onclick="save()">SAVE</button>
<button onclick="next()">NEXT</button>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";

let userId = "";
let config = {};
let data = [];
let i = 0;

/* Google login */
function handleCredentialResponse(res){
  const payload = JSON.parse(atob(res.credential.split('.')[1]));
  userId = payload.email;
  restore();
}

/* restore */
async function restore(){

  try{
    const r = await fetch(`${API_URL}?mode=restore&userId=${userId}&reviewSpreadsheetId=${config.reviewSpreadsheetId || ""}`);
    const j = await r.json();

    if(j.first){
      document.getElementById("setup").style.display = "block";
      return;
    }

    loadNovel(j.novelId, j.currentIndex || 0);

  }catch(e){
    console.error(e);
  }
}

/* setup */
function saveSetup(){
  config.novelSpreadsheetId = document.getElementById("novelId").value.trim();
  config.reviewSpreadsheetId = document.getElementById("reviewId").value.trim();

  document.getElementById("setup").style.display = "none";
}

/* load novel */
async function loadNovel(sheet,start){

  const r = await fetch(`${API_URL}?mode=loadNovel&sheet=${sheet}&spreadsheetId=${config.novelSpreadsheetId}`);
  data = await r.json();

  i = start;
  document.getElementById("app").style.display = "block";
  render();
}

/* render */
function render(){

  if(!data[i]) return;

  document.getElementById("current").innerText = data[i].english;

  document.getElementById("prev").innerText =
    (data[i-1]?.english || "") + "\n" + (data[i-2]?.english || "");

  document.getElementById("next").innerText =
    (data[i+1]?.english || "") + "\n" + (data[i+2]?.english || "");
}

/* save */
async function save(){

  const d = data[i];

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      userId,
      novelId:d.chapter,
      sentenceId:i,
      chapter:d.chapter,
      english:d.english,
      answer:document.getElementById("answer").value,
      memo:document.getElementById("memo").value,
      time:new Date().toISOString(),
      currentIndex:i,
      novelSpreadsheetId:config.novelSpreadsheetId,
      reviewSpreadsheetId:config.reviewSpreadsheetId
    })
  });

}

/* next */
function next(){
  if(i < data.length - 1){
    i++;
    render();
  }
}

</script>

</body>
</html>
