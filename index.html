<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<title>LearningApp</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

.card{
  max-width:720px;
  margin:20px auto;
  padding:20px;
}

.titleCard{
  padding:12px;
  border:1px solid #ddd;
  margin:8px 0;
  cursor:pointer;
}

.prev,
.next{
  font-size:16px;
  color:#777;
  line-height:1.5;
  white-space:pre-wrap;
  margin:8px 0;
}

.current{
  font-size:22px;
  line-height:1.6;
  margin:14px 0;
}

textarea{
  width:100%;
  min-height:70px;
}

button{
  padding:10px;
  margin:5px 5px 5px 0;
}

.label{
  font-size:12px;
  color:#666;
  margin-top:10px;
}

#correct{
  white-space:pre-wrap;
  color:#444;
}

.note{
  white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="card">

<div id="loginView">

<div
id="g_id_onload"
data-client_id="9811975665-aahgiu80dqlpb841pt6u7m82en6eqcri.apps.googleusercontent.com"
data-callback="handleCredentialResponse"
></div>

<div
class="g_id_signin"
data-type="standard"
></div>

</div>

<div
id="setupView"
style="display:none;"
>

<h2>Setup</h2>

<div class="label">
NovelLibrary Spreadsheet ID
</div>

<textarea id="novelId"></textarea>

<div class="label">
ReviewDB Spreadsheet ID
</div>

<textarea id="reviewId"></textarea>

<button onclick="startFirstSetup()">
START
</button>

</div>

<div id="indexView"></div>

<div
id="readView"
style="display:none;"
>

<div id="prev" class="prev"></div>

<div
id="current"
class="current"
></div>

<div id="next" class="next"></div>

<hr>

<div class="label">
Answer
</div>

<textarea id="answer"></textarea>

<div class="label">
CorrectJP
</div>

<div id="correct"></div>

<div class="label">
Memo
</div>

<textarea id="memo"></textarea>

<div class="label">
Note
</div>

<div id="note"></div>

<button onclick="backSentence()">
BACK
</button>

<button onclick="checkAnswer()">
CHECK
</button>

<button onclick="nextSentence()">
NEXT
</button>

<button onclick="goIndex()">
NovelSelect
</button>

</div>

</div>

<script>

const API_URL =
"YOUR_APPS_SCRIPT_URL";

const CONFIG_DB_ID =
"YOUR_REVIEW_DB_ID";

let userId = "";

let config = {

  novelSpreadsheetId:"",
  reviewSpreadsheetId:""

};

let state = {

  novels:[],
  data:[],
  index:0,
  selectedNovel:""

};

/* =========================
   GOOGLE LOGIN
========================= */

async function
handleCredentialResponse(
  response
){

  const payload =
    JSON.parse(

      atob(
        response.credential
          .split(".")[1]
      )

    );

  userId =
    payload.email;

  const configRes =
    await fetch(

`${API_URL}?mode=getUserConfig&configSpreadsheetId=${CONFIG_DB_ID}&userId=${encodeURIComponent(userId)}`

    );

  const configJson =
    await configRes.json();

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  if(configJson.first){

    document.getElementById(
      "setupView"
    ).style.display =
      "block";

    return;
  }

  config.novelSpreadsheetId =
    configJson
      .novelSpreadsheetId;

  config.reviewSpreadsheetId =
    configJson
      .reviewSpreadsheetId;

  const restoreRes =
    await fetch(

`${API_URL}?mode=restore&reviewSpreadsheetId=${config.reviewSpreadsheetId}&userId=${encodeURIComponent(userId)}`

    );

  const restoreJson =
    await restoreRes.json();

  await loadIndex();

  await loadNovel(

    restoreJson.novelId,

    restoreJson.currentIndex

  );
}

/* =========================
   FIRST SETUP
========================= */

async function
startFirstSetup(){

  config.novelSpreadsheetId =

    document.getElementById(
      "novelId"
    ).value.trim();

  config.reviewSpreadsheetId =

    document.getElementById(
      "reviewId"
    ).value.trim();

  await fetch(

    API_URL,

    {

      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        mode:
          "saveUserConfig",

        userId,

        novelSpreadsheetId:
          config
            .novelSpreadsheetId,

        reviewSpreadsheetId:
          config
            .reviewSpreadsheetId

      })

    }

  );

  await loadIndex();

  document.getElementById(
    "setupView"
  ).style.display =
    "none";
}

/* =========================
   LOAD INDEX
========================= */

async function
loadIndex(){

  const res =
    await fetch(

`${API_URL}?mode=list&spreadsheetId=${config.novelSpreadsheetId}`

    );

  state.novels =
    await res.json();

  renderIndex();
}

/* =========================
   RENDER INDEX
========================= */

function renderIndex(){

  let html =
    "<h2>Novel List</h2>";

  state.novels
    .forEach(n=>{

    html += `

<div
class="titleCard"
onclick="loadNovel('${n.title}',0)"
>
${n.title}
</div>

`;

  });

  document.getElementById(
    "indexView"
  ).innerHTML = html;
}

/* =========================
   LOAD NOVEL
========================= */

async function
loadNovel(
  title,
  startIndex
){

  const res =
    await fetch(

`${API_URL}?mode=loadNovel&sheet=${encodeURIComponent(title)}&spreadsheetId=${config.novelSpreadsheetId}`

    );

  state.data =
    await res.json();

  state.selectedNovel =
    title;

  state.index =
    startIndex || 0;

  document.getElementById(
    "indexView"
  ).style.display =
    "none";

  document.getElementById(
    "readView"
  ).style.display =
    "block";

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const d =
    state.data[state.index];

  if(!d) return;

  const prevTexts = [];

  if(
    state.data[
      state.index-2
    ]
  ){

    prevTexts.push(

      state.data[
        state.index-2
      ].english

    );
  }

  if(
    state.data[
      state.index-1
    ]
  ){

    prevTexts.push(

      state.data[
        state.index-1
      ].english

    );
  }

  document.getElementById(
    "prev"
  ).innerText =

    prevTexts.join("\n");

  document.getElementById(
    "current"
  ).innerText =
    d.english;

  const nextTexts = [];

  if(
    state.data[
      state.index+1
    ]
  ){

    nextTexts.push(

      state.data[
        state.index+1
      ].english

    );
  }

  if(
    state.data[
      state.index+2
    ]
  ){

    nextTexts.push(

      state.data[
        state.index+2
      ].english

    );
  }

  document.getElementById(
    "next"
  ).innerText =

    nextTexts.join("\n");

  document.getElementById(
    "correct"
  ).innerText =
    d.correctJP;

  document.getElementById(
    "note"
  ).innerText =
    d.note || "";
}

/* =========================
   CHECK
========================= */

async function
checkAnswer(){

  const d =
    state.data[state.index];

  await fetch(

API_URL,

{

  method:"POST",

  headers:{
    "Content-Type":
      "application/json"
  },

  body:JSON.stringify({

    userId,

    novelId:
      state.selectedNovel,

    sentenceId:
      d.sentenceId,

    chapter:
      d.chapter,

    english:
      d.english,

    answer:
      document
        .getElementById(
          "answer"
        ).value,

    memo:
      document
        .getElementById(
          "memo"
        ).value,

    time:
      new Date()
        .toISOString(),

    currentIndex:
      state.index,

    novelSpreadsheetId:
      config
        .novelSpreadsheetId,

    reviewSpreadsheetId:
      config
        .reviewSpreadsheetId

  })

});

}

/* =========================
   NAV
========================= */

function nextSentence(){

  if(
    state.index <
    state.data.length-1
  ){

    state.index++;

    render();
  }
}

function backSentence(){

  if(state.index > 0){

    state.index--;

    render();
  }
}

function goIndex(){

  document.getElementById(
    "readView"
  ).style.display =
    "none";

  document.getElementById(
    "indexView"
  ).style.display =
    "block";
}

</script>

</body>
</html>
