<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Learning App</title>

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.hidden{display:none;}

.label{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.current{
  font-size:24px;
  font-weight:bold;
  line-height:1.5;
}

.context{
  font-size:14px;
  color:#666;
  white-space:pre-wrap;
}

textarea,
select{
  width:100%;
  height:70px;
  margin-top:8px;
  padding:10px;
  font-size:14px;
  box-sizing:border-box;
}

select{height:auto;}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.primary{background:#4CAF50;color:#fff;}
.nextBtn{background:#2196F3;color:#fff;}
.changeBtn{background:#666;color:#fff;}

@media (min-width:768px){
  .wrap{max-width:700px;}
  .current{font-size:28px;}
  textarea{height:90px;}
}

</style>
</head>

<body>

<div class="wrap">

<!-- SETUP -->
<div id="setup" class="card hidden">
  <div class="label">初回設定</div>
  <textarea id="novelId" placeholder="NovelLibrary ID"></textarea>
  <textarea id="reviewId" placeholder="ReviewDB ID"></textarea>
  <button class="primary" onclick="saveConfig()">START</button>
</div>

<!-- SELECT -->
<div id="select" class="card hidden">
  <div class="label">Novel Select</div>
  <select id="novelList"></select>
  <button class="primary" onclick="openNovel()">OPEN</button>
  <button class="changeBtn" onclick="changeConfig()">設定変更</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="card">
    <div class="label">Prev</div>
    <div id="prev" class="context"></div>
  </div>

  <div class="card">
    <div class="label">Current</div>
    <div id="current" class="current"></div>
  </div>

  <div class="card">
    <div class="label">Next</div>
    <div id="next" class="context"></div>
  </div>

  <div class="card">

    <textarea id="memo" placeholder="memo"></textarea>
    <textarea id="answer" placeholder="answer"></textarea>

    <div class="card">
      <div class="label">CorrectJP</div>
      <div id="correctJP" class="context"></div>
    </div>

    <button onclick="prev()">PREV</button>
    <button class="nextBtn" onclick="next()">NEXT</button>
    <button class="primary" onclick="check()">CHECK</button>
    <button class="changeBtn" onclick="changeConfig()">設定変更</button>

  </div>

</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwuzUthOtT5W1l4tyGGaeuNbsPnuy7HHwhfRkgW5EY9xd5yB3Rau0eJKyB5-JNEmtzIXw/exec";
const STORAGE_KEY="learning_app_config";

let config={},data=[],i=0;

window.addEventListener("load", init);

/* 初期化（ID保持あり） */
function init(){
  const saved = localStorage.getItem(STORAGE_KEY);

  if(!saved){
    showScreen("setup");
    return;
  }

  config = JSON.parse(saved);
  loadNovelList();
}

/* 画面制御 */
function showScreen(name){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("select").classList.add("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById(name).classList.remove("hidden");
}

/* 設定保存 */
function saveConfig(){
  config.novelId=document.getElementById("novelId").value.trim();
  config.reviewId=document.getElementById("reviewId").value.trim();

  localStorage.setItem(STORAGE_KEY,JSON.stringify(config));
  loadNovelList();
}

/* 設定リセット */
function changeConfig(){
  localStorage.removeItem(STORAGE_KEY);
  config={};
  showScreen("setup");
}

/* リスト取得 */
async function loadNovelList(){
  const list = await jsonp(
    API_URL+"?mode=getNovelList&spreadsheetId="+config.novelId
  );

  const sel=document.getElementById("novelList");
  sel.innerHTML="";

  list.forEach(n=>{
    const o=document.createElement("option");
    o.value=n.name;
    o.textContent=n.name;
    sel.appendChild(o);
  });

  showScreen("select");
}

/* 開始 */
async function openNovel(){
  const sheet=document.getElementById("novelList").value;

  data = await jsonp(
    API_URL+"?mode=loadNovel"
    +"&spreadsheetId="+config.novelId
    +"&sheetName="+sheet
  );

  i=0;
  showScreen("app");
  render();
}

/* 表示 */
function render(){
  document.getElementById("prev").innerText = data[i-1]?.english || "";
  document.getElementById("current").innerText = data[i]?.english || "END";
  document.getElementById("next").innerText = data[i+1]?.english || "";
  document.getElementById("correctJP").innerText = "";
}

/* 操作 */
function next(){ if(i<data.length-1){i++;render();} }
function prev(){ if(i>0){i--;render();} }

async function check(){

  const payload={
    userId:"local_user",
    novelId:config.novelId,
    sentenceId:i,
    chapter:data[i]?.chapter,
    english:data[i]?.english,
    answer:document.getElementById("answer").value,
    memo:document.getElementById("memo").value,
    time:new Date().toISOString(),
    currentIndex:i,
    novelSpreadsheetId:config.novelId,
    reviewSpreadsheetId:config.reviewId
  };

  await jsonp(
    API_URL+"?mode=save"
    +"&reviewSpreadsheetId="+config.reviewId
    +"&data="+encodeURIComponent(JSON.stringify(payload))
  );

  document.getElementById("correctJP").innerText =
    data[i]?.correctJP || "";
}

/* JSONP */
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);

    window[cb]=r=>{
      delete window[cb];
      document.body.removeChild(s);
      resolve(r);
    };

    const s=document.createElement("script");
    s.src=url+"&callback="+cb;
    s.onerror=reject;
    document.body.appendChild(s);
  });
}

</script>

</body>
</html>
